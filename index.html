<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0e1a15" />
    <title>Atrium</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%277%27 fill=%27%23173D32%27/%3E%3Cpath d=%27M16 7l6 9-6 9-6-9z%27 fill=%27%23B99A62%27/%3E%3C/svg%3E" />
    <style>
      /* Tokens and fonts come from src/shared/theme.css (imported by main.ts). The doorway uses the palace's dusk. */
      html, body { height: 100%; overflow: hidden; background: #0e1a15; color: var(--ivory); color-scheme: dark; }
      #app canvas { display: block; }
      #overlay {
        position: fixed; inset: 0; display: grid; place-items: center; padding: 16px;
        background: radial-gradient(60% 50% at 50% 38%, #193a30 0%, #0e1a15 100%);
        transition: opacity 420ms var(--ease);
      }
      #overlay.leaving { opacity: 0; pointer-events: none; }
      #overlay[hidden] { display: none; }
      .card { max-width: 30rem; text-align: center; }
      .lantern {
        width: 18px; height: 18px; margin: 0 auto 28px; transform: rotate(45deg);
        background: #f6e7c1; border-radius: 3px;
        box-shadow: 0 0 18px 6px rgba(185, 154, 98, 0.55), 0 0 60px 22px rgba(185, 154, 98, 0.18);
        animation: breathe 4.5s ease-in-out infinite;
      }
      @keyframes breathe { 50% { box-shadow: 0 0 22px 8px rgba(185, 154, 98, 0.62), 0 0 72px 28px rgba(185, 154, 98, 0.22); } }
      h1 { font-size: clamp(2.6rem, 8vw, 3.6rem); font-weight: 400; letter-spacing: 0.02em; margin: 0; color: var(--ivory); }
      .rule { width: 44px; height: 1px; background: var(--gold); margin: 18px auto 16px; opacity: 0.8; }
      .tagline { font-family: var(--font-display); font-size: 1.15rem; line-height: 1.5; color: var(--sage); margin: 0; }
      .buttons { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-top: 32px; }
      #overlay button { color: var(--ivory); border-color: rgba(244, 240, 230, 0.28); }
      #overlay button:hover { border-color: var(--gold); background: rgba(23, 61, 50, 0.6); }
      /* Primary is gold on the doorway; when VR isn't available, "Try on desktop" takes the primary role. */
      #overlay button.primary, #enter-vr[hidden] + #desktop { background: var(--gold); border-color: var(--gold); color: var(--charcoal); }
      #overlay button.primary:hover, #enter-vr[hidden] + #desktop:hover { background: #c7aa74; box-shadow: none; }
      .hint { font-size: 0.92rem; line-height: 1.55; color: #9fb09f; margin: 28px auto 0; max-width: 26rem; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="overlay">
      <div class="card">
        <div class="lantern" aria-hidden="true"></div>
        <h1>Atrium</h1>
        <div class="rule" aria-hidden="true"></div>
        <p class="tagline">Your hands write it. Your palace keeps it.<br />You never fall behind.</p>
        <div class="buttons">
          <button id="enter-vr" class="primary" hidden>Enter VR</button>
          <button id="desktop">Try on desktop</button>
        </div>
        <p class="hint">Sit down, put the controllers away and raise your hands. On desktop: point with the mouse, click to select, arrow keys to turn, Esc to pause.</p>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
